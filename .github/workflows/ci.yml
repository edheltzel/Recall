name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  macos:
    name: macOS primary
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release version consistency
        run: bun run check:version

      - name: Type-check
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: OpenCode integration e2e
        run: bun run test:e2e:opencode

  worktree:
    name: Worktree baseline
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # AGENTS.md mandates that workers run in an isolated git worktree, so a
      # worktree is the DEFAULT environment for automated work — not an edge
      # case. Ten lifecycle/config tests once failed there while passing in a
      # normal checkout (#243), which trains agents to read a red suite as
      # normal. This leg makes worktree-hostility fail loudly instead.
      #
      # A fresh worktree has no node_modules (#165), so dependencies are
      # installed inside it rather than inherited from the primary checkout.
      - name: Run the suite inside a git worktree
        run: |
          set -euo pipefail
          git worktree add ../recall-worktree HEAD
          cd ../recall-worktree
          test ! -d node_modules
          bun install --frozen-lockfile
          bun run lint
          bun test

  ubuntu-smoke:
    name: Ubuntu compatibility smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release version consistency
        run: bun run check:version

      - name: Type-check
        run: bun run lint

      # Explicitly prove sqlite-vec loads NATIVELY on Linux (issue #148): Bun's
      # bundled SQLite is extension-capable, so isVecAvailable() must be true and
      # native KNN must match the brute-force ranking here. macOS loads it
      # best-effort via Homebrew libsqlite3; this leg is the Linux native-load gate.
      # Suite F + the hybrid-backend tests are pinned here too (#217): the macOS
      # full-suite leg only exercises them because the runner image happens to
      # ship Homebrew sqlite — this step makes vec-enabled coverage explicit.
      - name: Verify sqlite-vec native load (Linux)
        run: bun test tests/db/sqlite-vec-load.test.ts tests/db/vec.test.ts tests/benchmarks/suite-f.test.ts tests/mcp-hybrid-vec-fallback.test.ts

      # Ubuntu is a portability smoke target, not Recall's primary platform.
      # macOS runs the full test suite; Linux still builds to catch Bun/ESM and shell portability regressions.
      - name: Build
        run: bun run build
